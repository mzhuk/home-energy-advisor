[project]
name = "home-energy-advisor-backend"
version = "0.1.0"
description = "FastAPI backend for the Home Energy Advisor demo."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asgi-correlation-id>=4.3.4",
    "fastapi>=0.115.0",
    "litellm>=1.74.0",
    "llm-guard>=0.3.16",
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "pydantic-settings>=2.6.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    "ty>=0.0.1a17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty]
environment.root = ["."]
